# CodeRabbit AI Code Review 配置
# 文档: https://docs.coderabbit.ai/configuration

language: zh-CN

reviews:
  auto_review:
    enabled: true
    # PR 描述为空时自动生成
    auto_title_placeholder: "[WIP]"

  # Review 风格
  profile: concise

  # 关注重点
  high_level_summary: true
  poem: false
  review_status: true

  # 路径过滤 - 忽略不需要 review 的文件
  path_filters:
    - "!build/**"
    - "!.cache/**"
    - "!third_party/**"
    - "!*.md"
    - "!*.json"
    - "!*.mfs"
    - "!log/**"

  path_instructions:
    - path: "hardware/**"
      instructions: "关注线程安全、串口通信稳定性、相机资源释放"
    - path: "aimer/**"
      instructions: "关注算法正确性、实时性能、数值稳定性"
    - path: "umt/**"
      instructions: "关注线程安全、内存管理、死锁风险"

chat:
  auto_reply: true