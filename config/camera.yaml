%YAML:1.0
---
# IMU安装偏差修正 (Gimbal → Imu)
R_gimbal2imubody: [ 1, 0, 0, 0, 1, 0, 0, 0, 1 ]

# 相机坐标系转换 (Camera → Gimbal)
# Camera: x右, y下, z前 (OpenCV惯例)
# Gimbal: x前, y左, z上 (ROS惯例)
# x_gim = z_cam, y_gim = -x_cam, z_gim = -y_cam
R_camera2gimbal: [ 0, 0, 1, -1, 0, 0, 0, -1, 0 ]

# 相机内参 (重投影误差: 0.1833px)
camera_matrix:
  [ 2414.9359264386621, 0, 717.26243105567414, 0,
    2418.0489262208148, 582.68540529942845,
    0, 0, 1 ]
distort_coeffs:
  [ -0.0209453389287673, 0.15028138841073832, -0.0006517722113234505, -0.0016861906197686788, 0 ]
