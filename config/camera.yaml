%YAML:1.0
---
# IMU安装偏差修正 (Gimbal → Imu)
R_gimbal2imubody: [ 1, 0, 0, 0, 1, 0, 0, 0, 1 ]

# 相机坐标系转换 (Camera → Gimbal)
# Camera: x右, y下, z前 (OpenCV惯例)
# Gimbal: x前, y左, z上 (ROS惯例)
# x_gim = z_cam, y_gim = -x_cam, z_gim = -y_cam
#R_camera2gimbal: [ 0, 0, 1, -1, 0, 0, 0, -1, 0 ]
R_camera2gimbal: [ -0.012231, 0.010726, 0.999868, -0.999889, -0.008670, -0.012139, 0.008538, -0.999904, 0.010831 ]
# 相机内参 (重投影误差: 0.1833px)
camera_matrix:
  [ 2360.800068834144, 0, 708.3801773170803, 0,
    2360.192024166278, 541.3848728429539,
    0, 0, 1 ]
distort_coeffs:
  [ -0.05821064388133674, 0.1205391771110321, 0.0007569356351735787, 0.0006667014911261957, 0 ]

