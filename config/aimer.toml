# 该文件支持热更新
# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10

[Transformer]
    # Camera → Gimbal 平移 (米, 在Gimbal坐标系下)
    # 坐标系约定: x前, y左, z上 (ROS惯例)
    #@double 相机在云台前方距离
    #camera_offset_x = 0.0
    #@double 相机在云台左侧距离
    #camera_offset_y = 0.0
    #@double 相机在云台上方距离
    #camera_offset_z = 0.0
    camera_offset_x = 0.0116
    camera_offset_y = -0.0029
    camera_offset_z = 0.0547

    # Barrel → Gimbal 平移 (米, 在Gimbal坐标系下)
    #@double 枪口在云台前方距离
    barrel_offset_x = 0.0
    #@double 枪口在云台左侧距离
    barrel_offset_y = 0.0
    #@double 枪口在云台下方距离 (z负=下)
    barrel_offset_z = -0.055

[AutoAim]
[AutoAim.Predictor]
    # 可视化
    #@bool 是否显示预测可视化窗口
    show_window = true

    # 面积过滤
    #@double 已存在装甲板的最小面积比例
    existing_armor_area_ratio = 0.30
    #@double 新装甲板的最小面积比例
    new_armor_area_ratio = 0.40

    # 距离过滤
    #@double 最小有效距离 (m)，过近可能是误识别
    min_distance = 0.1
    #@double 最大有效距离 (m)
    max_distance = 15.0
    #@double 新装甲板最大距离 (m)，防止远处误识别
    new_armor_max_distance = 10.0

    # 跳变过滤
    #@double 相邻帧最大位置跳变 (m)
    jump_distance_limit = 1.2
    #@double 判断"已存在装甲板"的距离阈值 (m)
    existing_armor_distance = 0.5

    # 超时
    #@double 丢失目标超时 (s)
    lost_timeout = 0.5
    #@double 装甲板滤波器信用时间 (s)
    armor_credit_time = 0.1

[AutoAim.Predictor.EKF]
    # 过程噪声 Q (越大越信任观测，越小越信任预测)
    #@double 位置过程噪声 (yaw/pitch/dis)
    q_pos = 0.01
    #@double 速度过程噪声 (vyaw/vpitch/vdis)，大值允许快速加减速
    q_vel = 100.0

    # 观测噪声 R (越大越不信任观测)
    #@double 角度观测噪声 (yaw/pitch, rad²)
    r_angle = 1.0
    #@double 1m处距离观测噪声 (m²)，随距离²增大
    r_dis_1m = 50.0

    # 调试用
    #@double 绘图时的预测时间 (s)，用于可视化预测效果
    draw_predict_dt = 0.50

[AutoAim.Predictor.SpinEKF]
    # 过程噪声 Q (越大越信任观测，越小越信任预测)
    #@double 旋转中心位置过程噪声 (xc, yc, zc)
    q_pos = 0.1
    #@double 旋转中心速度过程噪声 (vx, vy, vz)，大值允许快速加减速
    q_vel = 15.0
    #@double 车体朝向角θ过程噪声
    q_theta = 0.1
    #@double 角速度ω过程噪声，较大以适应陀螺加减速
    q_omega = 10.0
    #@double 陀螺半径r过程噪声
    q_r = 1.0

    # 观测噪声 R (越大越不信任观测)
    #@double yaw/pitch角度观测噪声 (rad²)
    r_angle = 8.0
    #@double 距离观测噪声系数, R_dis = r_dis_k × distance²
    r_dis_k = 25.0
    #@double 装甲板朝向角观测噪声 (rad²)
    r_armor_yaw = 20.0

    # 半径参数
    #@double 初始半径 (m)
    init_r = 0.26
    #@double 最小半径限制 (m)
    r_min = 0.12
    #@double 最大半径限制 (m)
    r_max = 0.4

    # Z轴约束 (PnP在Z方向误差大)
    #@bool 强制Z轴速度为0
    force_zero_vz = true
    #@double 两对装甲板高度差最大值 (m)
    dz_abs_max = 0.10

[AutoAim.Predictor.OutpostEKF]
    # 过程噪声 Q (越大越信任观测，越小越信任预测)
    #@double 旋转中心位置过程噪声
    q_pos = 0.1
    #@double 旋转中心速度过程噪声 (前哨站定点旋转，设很小仅用于修正初始误差)
    q_vel = 0.1
    #@double 相位θ过程噪声
    q_theta = 0.1
    #@double 角速度ω过程噪声 (方向确定后自动缩小100倍)
    q_omega = 1.0

    # 观测噪声 R (越大越不信任观测)
    #@double yaw/pitch角度观测噪声 (rad²)
    r_angle = 8.0
    #@double 距离观测噪声系数, R_dis = r_dis_k × distance²
    r_dis_k = 25.0
    #@double 装甲板朝向角观测噪声 (rad²)
    r_armor_yaw = 20.0

    # 角速度约束 (规则值: |ω| = 0.8π ≈ 2.51 rad/s)
    #@bool 锁定ω到规则值，false则让EKF自由估计
    lock_omega = true
    #@double 判断旋转方向的阈值，|ω|超过此值则确定顺/逆时针 (rad/s)
    omega_direction_threshold = 1.88
    #@double 方向确定后，允许|ω|偏离0.8π的范围，超出则强制修正 (rad/s)
    omega_tolerance = 0.3

    # 速度约束 (前哨站定点旋转)
    #@bool 强制速度清零，每次更新后将vx,vy设为0
    force_zero_velocity = true

# ==================== 火控配置 ====================

[AutoAim.FireControl]
    #@bool 是否使用MPC模式，false则使用简化模式 (仅位置跟踪)
    use_mpc = false
    #@double 射击误差阈值 (rad)，MPC规划误差小于此值才开火
    fire_threshold = 0.02
    #@double 最小置信度，目标置信度低于此值不开火
    min_confidence = 0.3
    #@double 误差容忍比例 (简化模式)，落点偏移 < 装甲板尺寸 * error_rate 时开火
    error_rate = 0.6

[AutoAim.FireControl.Latency]
    # 延迟模型 (参考 rm.cv.fans)
    # 时间轴: img → predict → send → control → fire → hit
    #
    # 预测时间 = img_to_control + fly_time
    # 开火时机 = control_to_fire (用于反陀螺打击时机)

    #@double 图像传输 + 神经网络推理延迟 (s)
    img_to_predict = 0.010
    #@double 预测计算 + 发送准备延迟 (s)
    predict_to_send = 0.002
    #@double 信号传输延迟 (s)
    # @param +: 调大将使对运动靶的跟踪更超前
    send_to_control = 0.003

    #@double 控制到开火的延迟 (s)，测量值
    # @param +: 调大将提早反陀螺模型的打击
    # @note 不参与预测时间计算，仅用于反陀螺打击时机
    control_to_fire = 0.020

    #@double 稳态偏差补偿时间常数 t0 (s)
    # 电控 PID 跟踪斜坡函数时存在稳态偏差 = yaw_v * t0
    # 需要发送 yaw + t0 * yaw_v 来补偿
    # 通过跟踪匀速目标实验来暴力测出
    steady_state_time_constant = 0.015

[AutoAim.FireControl.MPC]
    #@double 控制周期 (s)
    dt = 0.01
    #@int 预测时域
    horizon = 100
    #@int 取控制量的位置 (对应500ms)
    half_horizon = 50

    # yaw 轴参数
    #@double yaw 位置权重
    q_yaw_pos = 9e6
    #@double yaw 速度权重
    q_yaw_vel = 0.0
    #@double yaw 控制 (加速度) 权重
    r_yaw_acc = 1.0
    #@double yaw 最大加速度 (rad/s²)
    max_yaw_acc = 50.0

    # pitch 轴参数
    #@double pitch 位置权重
    q_pitch_pos = 9e6
    #@double pitch 速度权重
    q_pitch_vel = 0.0
    #@double pitch 控制 (加速度) 权重
    r_pitch_acc = 1.0
    #@double pitch 最大加速度 (rad/s²)
    max_pitch_acc = 100.0

    #@int MPC 最大迭代次数
    max_iter = 10

[AutoAim.FireControl.PID]
    #@double 最大跟踪角 (deg)，装甲板朝向超过此角度切换到 INDIRECT 模式
    max_orientation_angle = 60.0
    #@double 开火提前量 (s)，INDIRECT 模式额外提前开火的时间
    # 实际开火时机 = time_to_fire <= control_to_fire + fire_advance
    fire_advance = 0.03

[AutoAim.FireControl.Trajectory]
    #@double 重力加速度 (m/s²)
    gravity = 9.8
    #@double 空气阻力系数 k (线性阻力模型)
    air_resistance_k = 0.01
    #@int 弹道解算最大迭代次数
    max_iter = 10

[AutoAim.FireControl.TargetSelector]
    # 权重系数
    #@double 面积权重 (最重要)
    w_area = 2.0
    #@double 静止权重 (速度越小越好)
    w_still = 1.5
    #@double 距离权重 (近优先)
    w_distance = 1.0
    #@double 类型优先级权重 (英雄>步兵>哨兵)
    w_priority = 1.0
    #@double 置信度权重
    w_confidence = 0.5

    #@double 面积过滤比例，小于最大面积*此比例的装甲板排除
    area_filter_ratio = 0.4
    #@double 目标切换迟滞，新目标必须好于当前*此比例才切换
    switch_hysteresis = 0.15
    #@double 同一目标内装甲板切换迟滞
    switch_armor_hysteresis = 0.10
    #@double 静止判定速度影响系数
    still_speed_scale = 2.0
    #@double 最大有效距离 (m)
    max_distance = 10.0
    #@double 最大有效角度 (rad, 约70°)
    max_angle = 1.2