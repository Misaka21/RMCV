# 该文件支持热更新
# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10

[Transformer]
    # Camera → Gimbal 平移 (米, 在Gimbal坐标系下)
    # 坐标系约定: x前, y左, z上 (ROS惯例)
    #@double 相机在云台前方距离
    #camera_offset_x = 0.0
    #@double 相机在云台左侧距离
    #camera_offset_y = 0.0
    #@double 相机在云台上方距离
    #camera_offset_z = 0.0
    camera_offset_x = 0.0295
    camera_offset_y = -0.0068
    camera_offset_z = -0.0228


    # Barrel → Gimbal 平移 (米, 在Gimbal坐标系下)
    #@double 枪口在云台前方距离
    barrel_offset_x = 0.0
    #@double 枪口在云台左侧距离
    barrel_offset_y = 0.0
    #@double 枪口在云台下方距离 (z负=下)
    barrel_offset_z = -0.055

[AutoAim]
[AutoAim.Predictor]
    # 整车运动模型选择: "spin" (旧), "lmtd", "sp" (新, 推荐)
    #@string 整车运动模型
    motion_model = "sp"

    #@bool 是否使用双装甲板联合三分法优化 (fit_double_z_to_l)
    # true: 利用 90° 几何约束联合优化两块装甲板朝向角
    # false: 各自独立优化
    use_double_z_fit = true

    # 面积过滤
    #@double 已存在装甲板的最小面积比例
    existing_armor_area_ratio = 0.30
    #@double 新装甲板的最小面积比例
    new_armor_area_ratio = 0.40

    # 距离过滤
    #@double 最小有效距离 (m)，过近可能是误识别
    min_distance = 0.1
    #@double 最大有效距离 (m)
    max_distance = 8.0
    #@double 新装甲板最大距离 (m)，防止远处误识别
    new_armor_max_distance = 8.0

    # 跳变过滤
    #@double 相邻帧最大位置跳变 (m)
    jump_distance_limit = 1.2
    #@double 判断"已存在装甲板"的距离阈值 (m)
    existing_armor_distance = 0.5

    # 超时
    #@double 丢失目标超时 (s)
    lost_timeout = 0.5
    #@double 装甲板滤波器信用时间 (s)
    armor_credit_time = 0.1
    #@double 装甲板“可见”时间窗口 (s)，超过窗口仅保留预测不视为可见
    visible_time_window = 0.04

[AutoAim.Predictor.IDDebounce]
    # 新 target_id 需连续出现达到阈值才创建模型，抑制 T2/T3/T7 抖动分裂
    #@double 新目标确认最短持续时间 (s)
    new_target_confirm_time = 0.10
    #@double 连续出现判定的最大间隔 (s)，超过则重新计数
    new_target_max_gap = 0.08
    #@double 候选目标超时清理时间 (s)
    pending_timeout = 0.30

[AutoAim.Predictor.EKF]
    # 过程噪声 Q (越大越信任观测，越小越信任预测)
    #@double 位置过程噪声 (yaw/pitch/dis)
    q_pos = 0.01
    #@double 速度过程噪声 (vyaw/vpitch/vdis)，大值允许快速加减速
    q_vel = 100.0

    # 观测噪声 R (越大越不信任观测)
    #@double 角度观测噪声 (yaw/pitch, rad²)
    r_angle = 1.0
    #@double 1m处距离观测噪声 (m²)，随距离²增大
    r_dis_1m = 50.0

    # 调试用
    #@double 绘图时的预测时间 (s)，用于可视化预测效果
    draw_predict_dt = 0.50

[AutoAim.Predictor.EKF.Gating]
    # 马氏距离门限检查参数 (3维观测, p=0.01)
    #@double χ²门限, 超过则拒绝观测
    chi2_threshold = 11.34
    #@int 连续拒绝次数上限, 超过则重置EKF
    max_reject = 5
    #@double 拒绝后过程噪声放大倍数
    q_scale_increase = 1.5
    #@double 接受后过程噪声衰减倍数 (最小为1.0)
    q_scale_decay = 0.9

# 统一的陀螺等级判断参数 (被 VehicleModel 使用)
[AutoAim.Predictor.Motion]
    # 陀螺等级阈值 (度/秒, 带迟滞消抖)
    #@double top_level 1 激活阈值 (°/s)
    top1_activate_w = 90.0
    #@double top_level 1 退激活阈值 (°/s)
    top1_deactivate_w = 60.0
    #@double top_level 2 激活阈值 (°/s)
    top2_activate_w = 500.0
    #@double top_level 2 退激活阈值 (°/s)
    top2_deactivate_w = 450.0

[AutoAim.Predictor.SpinEKF]
    # 过程噪声 Q (越大越信任观测，越小越信任预测)
    # 参考 rm.cv.fans lmtd-top-model 参数
    #@double 旋转中心位置过程噪声 (xc, yc, zc)
    q_pos = 1.2
    #@double 旋转中心速度过程噪声 (vx, vy, vz)，大值允许快速加减速
    q_vel = 800.0
    #@double 车体朝向角θ过程噪声
    q_theta = 0.6
    #@double 角速度ω过程噪声，较大以适应陀螺加减速
    q_omega = 120.0
    #@double 陀螺半径r过程噪声
    q_r = 0.003
    #@double 高度差dz过程噪声 (dz 现在在状态向量中滤波)
    q_dz = 6.0

    # 观测噪声 R (越大越不信任观测，滤波越平滑)
    #@double yaw/pitch角度观测噪声 (调大减少位置抖动)
    r_angle = 4.0
    #@double 距离观测噪声系数, R_dis = r_dis_k × distance⁴
    r_dis_k = 35.0
    #@double 装甲板朝向角观测噪声 - 单块时 (调大减少朝向抖动)
    r_armor_yaw_single = 45.0
    #@double 装甲板朝向角观测噪声 - 双块时
    r_armor_yaw_double = 22.0

    # 半径参数
    #@double 初始半径 (m)
    init_r = 0.26
    #@double 最小半径限制 (m)，长短轴差不多的车用 0.23
    r_min = 0.23
    #@double 最大半径限制 (m)，长短轴差不多的车用 0.29
    r_max = 0.29

    # Z轴约束 (PnP在Z方向误差大)
    #@bool 强制Z轴速度为0
    force_zero_vz = true
    #@double 两对装甲板高度差最大值 (m)
    dz_abs_max = 0.10

    # 装甲板选择 (防止双板横跳)
    #@double 保持追踪的面积比例，当前追踪装甲板面积 >= 最大面积 * 此比例时保持追踪
    keep_tracking_area_ratio = 0.9

[AutoAim.Predictor.SpinEKF.Gating]
    # 马氏距离门限检查参数 (4维观测, p=0.01)
    #@double χ²门限, 超过则拒绝观测
    chi2_threshold = 13.28
    #@int 连续拒绝次数上限, 超过则重置EKF
    max_reject = 5
    #@double 拒绝后过程噪声放大倍数
    q_scale_increase = 1.5
    #@double 接受后过程噪声衰减倍数 (最小为1.0)
    q_scale_decay = 0.9

[AutoAim.Predictor.LmtdEKF]
    # LMTD 整车旋转模型 (参考 rm.cv.fans lmtd::TopModel)
    # 关键区别: x[4] = 装甲板 z (不是中心 z)，避免 PnP 累积误差
    # 角度约定: OUTWARD (θ 从中心指向装甲板)

    # 过程噪声 Q (参考 rm.cv.fans: q.pos.x.in-1s = 2.8, q.pos.v.in-1s = 2800)
    #@double 旋转中心位置过程噪声 (原 0.01 → 2.8)
    q_pos = 2.8
    #@double 旋转中心速度过程噪声 (原 10.0 → 2800.0)
    q_vel = 2800.0
    #@double 朝向角θ过程噪声 (原 0.01 → 2.8)
    q_theta = 2.8
    #@double 角速度ω过程噪声 (原 10.0 → 280.0)
    q_omega = 280.0
    #@double 半径r过程噪声 (不乘 dt, 原 0.001 → 1.0)
    q_r = 1.0

    # 观测噪声 R (参考 rm.cv.fans: r.yaw = 8.0, r.orientation-yaw.single = 30.0)
    # R 越大 = 越不信任观测 = 滤波越平滑
    #@double yaw/pitch角度观测噪声 (调大减少位置抖动)
    r_angle = 8.0
    #@double 1m处距离观测噪声，实际 R_dis = r_dis_1m * dis^4
    r_dis_1m = 26.0
    #@double 装甲板朝向角观测噪声 - 单块 (rm.cv.fans: 30.0)
    r_orient_single = 30.0
    #@double 装甲板朝向角观测噪声 - 双块 (rm.cv.fans: 15.0)
    r_orient_double = 15.0

    # 半径参数 (根据实际车型调整)
    #@double 初始半径 (m)
    init_r = 0.26
    #@double 最小半径限制 (m)，rm.cv.fans 用 0.19
    r_min = 0.19
    #@double 最大半径限制 (m)，rm.cv.fans 用 0.30
    r_max = 0.30

    # Z轴约束
    #@bool 强制Z轴速度为0
    force_zero_vz = true
    #@double 高度差最大值 (m)
    dz_abs_max = 0.10

    # 信用时间 (超时重新 init)
    #@double 观测超时阈值 (s)，rm.cv.fans 用 1.0
    credit_dt = 1.0

    # 装甲板选择 (防止反复横跳)
    # rm.cv.fans 用 0.9，非常保守，减少跳变让半径有时间收敛
    #@double 保持追踪的面积比例，当前追踪装甲板面积 >= 最大面积 * 此比例时保持追踪
    keep_tracking_area_ratio = 0.9

    # 陀螺等级阈值 (度/秒, 与 rm.cv.fans 一致)
    #@double top_level 1 激活阈值 (°/s)
    top1_activate_w = 90.0
    #@double top_level 1 退激活阈值 (°/s)
    top1_deactivate_w = 60.0
    #@double top_level 2 激活阈值 (°/s)
    top2_activate_w = 500.0
    #@double top_level 2 退激活阈值 (°/s)
    top2_deactivate_w = 450.0

[AutoAim.Predictor.SpEKF]
    # SP 整车旋转模型 (移植自 sp_vision_25)
    # 核心区别: L 和 H 在状态向量内，切板时无需交换状态
    # 状态向量: [xc, vx, yc, vy, zc, vz, θ, ω, r, l, h] (11维)
    # l = r_odd - r_even (id=1,3 用 r+l)
    # h = z_odd - z_even (id=1,3 用 zc+h)

    # 过程噪声 Q (70df1a 基线)
    #@double 旋转中心位置过程噪声
    q_pos = 2.2
    #@double 旋转中心速度过程噪声
    q_vel = 32.0
    #@double 朝向角θ过程噪声
    q_theta = 0.5
    #@double 角速度ω过程噪声，较大值以更快响应陀螺加减速
    q_omega = 900.0
    #@double 基础半径r过程噪声
    q_r = 0.003
    #@double 半径差l过程噪声 (不乘dt)
    q_l = 0.003
    #@double 高度差h过程噪声 (不乘dt)
    q_h = 0.003

    # 观测噪声 R (70df1a 基线)
    #@double yaw/pitch角度观测噪声
    r_angle = 2.8
    #@double 距离观测噪声系数, R_dis = r_dis_k × distance⁴
    r_dis_k = 8.0
    #@double 装甲板朝向角观测噪声 - 单块
    r_armor_yaw_single = 4.2
    #@double 装甲板朝向角观测噪声 - 双块
    r_armor_yaw_double = 2.1

    # 几何参数
    #@double 初始半径 (m)
    init_r = 0.26
    #@double 最小半径限制 (m)
    r_min = 0.19
    #@double 最大半径限制 (m)
    r_max = 0.30
    #@double 半径差绝对值最大值 (m)
    l_abs_max = 0.15
    #@double 高度差绝对值最大值 (m)
    h_abs_max = 0.10

    # Z轴约束
    #@bool 强制Z轴速度为0
    force_zero_vz = true

    # 装甲板选择 (防止反复横跳)
    # rm.cv.fans 用 0.9，非常保守，减少跳变让半径有时间收敛
    # 5.2k/9k ≈ 0.58，设为 0.6 可以让系统切换到大装甲板
    #@double 保持追踪的面积比例，当前追踪装甲板面积 >= 最大面积 * 此比例时保持追踪
    keep_tracking_area_ratio = 0.9

    # 匹配切板迟滞参数（在 70df1a 基线上新增）
    #@double 切板所需最小角度优势 (rad)
    match_switch_min_angle_gain = 0.24
    #@double 切板所需最小位置优势 (m)
    match_switch_min_dist_gain = 0.03
    #@double 旧追踪板可接受最大匹配距离 (m)
    match_tracked_max_dist = 0.35

    # 陀螺等级阈值 (度/秒)
    #@double top_level 1 激活阈值 (°/s)
    top1_activate_w = 90.0
    #@double top_level 1 退激活阈值 (°/s)
    top1_deactivate_w = 70.0
    #@double top_level 2 激活阈值 (°/s)
    top2_activate_w = 500.0
    #@double top_level 2 退激活阈值 (°/s)
    top2_deactivate_w = 450.0

[AutoAim.Predictor.SpEKF.Gating]
    # 马氏距离门限检查参数 (4维观测, p=0.01)
    #@double χ²门限, 超过则拒绝观测
    chi2_threshold = 13.28
    #@int 连续拒绝次数上限, 超过则重置EKF
    max_reject = 5
    #@double 拒绝后过程噪声放大倍数
    q_scale_increase = 1.5
    #@double 接受后过程噪声衰减倍数 (最小为1.0)
    q_scale_decay = 0.9

[AutoAim.Predictor.OutpostEKF]
    # 过程噪声 Q (越大越信任观测，越小越信任预测)
    #@double 旋转中心位置过程噪声
    q_pos = 0.1
    #@double 旋转中心速度过程噪声 (前哨站定点旋转，设很小仅用于修正初始误差)
    q_vel = 0.1
    #@double 相位θ过程噪声
    q_theta = 0.1
    #@double 角速度ω过程噪声 (方向确定后自动缩小100倍)
    q_omega = 1.0

    # 观测噪声 R (越大越不信任观测)
    #@double yaw/pitch角度观测噪声 (rad²)
    r_angle = 8.0
    #@double 距离观测噪声系数, R_dis = r_dis_k × distance²
    r_dis_k = 25.0
    #@double 装甲板朝向角观测噪声 (rad²)
    r_armor_yaw = 20.0

    # 角速度约束 (规则值: |ω| = 0.8π ≈ 2.51 rad/s)
    #@bool 锁定ω到规则值，false则让EKF自由估计
    lock_omega = true
    #@double 判断旋转方向的阈值，|ω|超过此值则确定顺/逆时针 (rad/s)
    omega_direction_threshold = 1.88
    #@double 方向确定后，允许|ω|偏离0.8π的范围，超出则强制修正 (rad/s)
    omega_tolerance = 0.3

    # 速度约束 (前哨站定点旋转)
    #@bool 强制速度清零，每次更新后将vx,vy设为0
    force_zero_velocity = true

[AutoAim.Predictor.OutpostEKF.Gating]
    # 马氏距离门限检查参数 (4维观测, p=0.01)
    #@double χ²门限, 超过则拒绝观测
    chi2_threshold = 13.28
    #@int 连续拒绝次数上限, 超过则重置EKF
    max_reject = 5
    #@double 拒绝后过程噪声放大倍数
    q_scale_increase = 1.5
    #@double 接受后过程噪声衰减倍数 (最小为1.0)
    q_scale_decay = 0.9

# ==================== 火控配置 ====================

[AutoAim.FireControl]
    #@double 最小置信度，目标置信度低于此值不开火
    min_confidence = 0.3
    #@double 开火误差容忍比例，落点偏移 < 装甲板尺寸 * error_rate 时开火
    error_rate = 0.6

[AutoAim.FireControl.AimOffset]
    #@double yaw 落点偏置 (rad)
    # @param +: 调大将向左打击
    yaw = 0.0
    #@double pitch 落点偏置 (rad)
    # @param +: 调大将向上打击
    pitch = 0.0

[AutoAim.FireControl.Cmd]
    #@double 额外预测时间 (s)
    # @param +: 调大将使对运动靶的跟踪更超前
    additional_predict_time = 0.060
    #@double 额外预测使用的角速度限幅 (rad/s)
    max_abs_vel = 12.0

[AutoAim.FireControl.Latency]
    # 延迟模型 (参考 rm.cv.fans)
    # 时间轴: img → predict → send → control → fire → hit
    # 说明:
    # - img_to_predict / predict_to_send 由系统在线估计，不在这里配置
    # - 这里只保留需手工标定的静态链路

    #@double 信号传输延迟 (s)
    # @param +: 调大将使对运动靶的跟踪更超前
    send_to_control = 0.003

    #@double 控制到开火的延迟 (s)，测量值
    # @param +: 调大将提早反陀螺模型的打击
    # @note 不参与预测时间计算，仅用于反陀螺打击时机
    control_to_fire = 0.020

[AutoAim.FireControl.PID]
    #@double 低速陀螺可见板朝向窗口 (deg)：仅在 [-angle, +angle] 内选可见板
    # @note <= 0 或高速陀螺时关闭窗口，始终按喵中心最小移动选可见板
    max_orientation_angle = 60.0
    #@double indirect 路径离场误差比例（rm.cv.fans max-out-error 同义）
    # 用于窗口边界附近的离场修正，减小回转期误发
    max_out_error = 0.2

[AutoAim.FireControl.Trajectory]
    #@string 求解器类型: 
    #   "analytic_linear" (解析解+Ceres,快), 
    #   "rk4_linear" (RK4+线性阻力), 
    #   "rk4_quadratic" (RK4+二次阻力,吊射推荐)
    solver = "analytic_linear"
    #@string 阻力模型 (仅RK4生效): "linear" 或 "quadratic"
    drag_model = "quadratic"
    #@double 重力加速度 (m/s²)
    gravity = 9.8
    #@double 空气阻力系数 k
    # 线性模型: a = -k*v, 单位 1/s
    # 二次模型: a = -k*v*|v|, 单位 1/m, 对于17mm弹丸约 0.001~0.005
    air_resistance_k = 0.01
    #@int 弹道解算最大迭代次数 (Ceres)
    max_iter = 10
    #@double RK4积分步长 (s)
    rk4_dt = 0.001
    #@int RK4二分法最大迭代
    rk4_max_iter = 50
    #@double RK4收敛阈值 (m)
    rk4_tolerance = 0.001

[AutoAim.FireControl.TargetSelector]
    #@double 目标保持时间 (s)，目标消失后等待此时间再切换
    keep_time = 0.1
    #@double 哨兵目标保持时间 (s)
    keep_time_sentry = 0.1
    #@double 基地目标保持时间 (s)
    keep_time_base = 0.1
    #@double 步兵目标保持时间 (s)
    keep_time_infantry = 0.1
    #@double 英雄目标保持时间 (s)
    keep_time_hero = 0.1
    #@double 工程目标保持时间 (s)
    keep_time_engineer = 0.1
    #@double 目标记忆时间 (s)，超过后释放锁存目标
    memorizing_time = 5.0
    #@double 前哨站目标保持时间 (s)
    keep_time_outpost = 0.5

