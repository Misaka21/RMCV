# 该文件支持热更新
# 本参数表角度均为角度制，物理量为国际单位。
# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10

[Transformer]
# Camera → Gimbal 平移 (米, 在Gimbal坐标系下)
# 坐标系约定: x前, y左, z上 (ROS惯例)
camera_offset_x = 0.0   # 相机在云台前方距离
camera_offset_y = 0.0   # 相机在云台左侧距离
camera_offset_z = 0.0   # 相机在云台上方距离

# Barrel → Gimbal 平移 (米, 在Gimbal坐标系下)
barrel_offset_x = 0.0   # 枪口在云台前方距离
barrel_offset_y = 0.0   # 枪口在云台左侧距离
barrel_offset_z = -0.055  # 枪口在云台下方5.5cm (z负=下)

#autoaim
[AutoAim]


