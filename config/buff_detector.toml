# =============================================================================
# 能量机关检测器配置
# =============================================================================
# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10

[Detector]
    #@bool 是否开启调试模式
    debug = false

# ==================== YOLOX 检测器配置 ====================
# 模型: FYT yolox_rune_3.6m
# 输出: 5 关键点 (r_center + 4 装甲板角点) + 颜色 + 类型
# 注意: 模型不需要 /255 归一化, 内部处理

[Detector.Yolo]
    #@string 推理后端: "openvino" 或 "tensorrt"
    backend = "openvino"
    #@string 模型文件路径 (相对于 asset 目录)
    model_path = "yolox_rune_3.6m.onnx"
    #@double 置信度阈值
    conf_threshold = 0.50
    #@double NMS 阈值
    nms_threshold = 0.30
    #@int 输入尺寸
    input_size = 480

[Detector.Yolo.OpenVINO]
    #@string 推理设备: "GPU", "CPU", "AUTO"
    device = "GPU"

[Detector.Yolo.TensorRT]
    #@bool 是否启用 FP16 量化
    fp16 = true
    #@bool 是否启用 INT8 量化
    int8 = false
    #@int 工作空间大小 (MB)
    workspace_mb = 1024
