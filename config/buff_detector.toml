# =============================================================================
# 能量机关检测器配置
# =============================================================================
# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10

[Detector]
    #@bool 是否开启调试模式
    debug = true

# ==================== 检测器后端选择 ====================
# backend 可选:
#   "traditional"  - 传统 CV 管线 (颜色差分 + 轮廓分析, 纯 CPU)
#   "openvino"     - YOLOX 模型 OpenVINO 推理
#   "tensorrt"     - YOLOX 模型 TensorRT 推理
# 切换后重启程序生效。传统检测器参数在 config/buff.toml [AutoBuff.Detector.Traditional]
[Detector.Backend]
    #@string 检测后端: "traditional" / "openvino" / "tensorrt"
    backend = "traditional"

# ==================== YOLOX 模型参数 (backend != traditional 时生效) ====================
[Detector.Yolo]
    #@string 模型文件路径 (相对于 asset 目录)
    model_path = "yolox_rune_3.6m.onnx"
    #@double 置信度阈值
    conf_threshold = 0.50
    #@double NMS 阈值
    nms_threshold = 0.30
    #@int 输入尺寸
    input_size = 480

[Detector.Yolo.OpenVINO]
    #@string 推理设备: "GPU", "CPU", "AUTO"
    device = "GPU"

[Detector.Yolo.TensorRT]
    #@bool 是否启用 FP16 量化
    fp16 = true
    #@bool 是否启用 INT8 量化
    int8 = false
    #@int 工作空间大小 (MB)
    workspace_mb = 1024
