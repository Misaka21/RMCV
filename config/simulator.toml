# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10
# Simulator配置 - at_vision_simulator接入
# https://github.com/Blackjack200/at_vision_simulator

[Simulator]
    # ROS2 Topic名称 (来自at_vision_simulator)
    #@string 图像Topic
    image_topic = "/image_compressed"
    #@string 云台姿态Topic
    gimbal_pose_topic = "/gimbal_pose"

[Simulator.serial]
    # 模拟串口数据 (替代真实电控)
    #@int 机器人ID
    robot_id = 1
    #@int 敌方颜色: 1=红, 2=蓝
    enemy_color = 2
    #@double 弹速 (m/s)
    bullet_speed = 15.0
    #@int 自瞄模式: 0=关, 1=自瞄
    aim_mode = 1
    #@bool 允许射击
    allow_fire = true
