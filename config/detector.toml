# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10

[Detector]
    #@string 检测器类型: "traditional" 或 "yolo"
    type = "yolo"

# ==================== 传统检测器配置 ====================

[Detector.traditional]
    #@bool 是否开启调试模式
    debug = true
    #@int 二值化阈值
    binary_thres = 100
    #@bool 是否开启灯条角点最小二乘校正
    use_pca = true

[Detector.traditional.classify]
    #@double 数字分类阈值
    threshold = 0.8
    #@string 分类模型类型: "lenet" (28x28) 或 "mlp" (20x28)
    model_type = "lenet"
    #@string 分类模型路径 (相对于asset目录)
    model_path = "lenet.onnx"
    #@string 标签文件路径
    label_path = "label.txt"
    #@array<string> 跳过的类别
    ignore_classes = ["negative"]

[Detector.traditional.light]
    #@double 灯条最小长宽比
    min_ratio = 0.01
    #@double 灯条最大长宽比
    max_ratio = 0.4
    #@double 灯条最大倾斜角度 (度)
    max_angle = 40.0
    #@int 灯条颜色差异阈值
    color_diff_thresh = 25

[Detector.traditional.armor]
    #@double 装甲板灯条最小长宽比
    min_light_ratio = 0.6
    #@double 小装甲板最小中心距离长宽比
    min_small_center_distance = 0.8
    #@double 小装甲板最大中心距离长宽比
    max_small_center_distance = 3.2
    #@double 大装甲板最小中心距离长宽比
    min_large_center_distance = 3.2
    #@double 大装甲板最大中心距离长宽比
    max_large_center_distance = 5.0
    #@double 装甲板最大倾斜角度 (度)
    max_angle = 35.0

# ==================== YOLO 检测器配置 ====================
# 来自 RobotPilots 的魔改 YOLOv5 (MobileNetV3 backbone)
# 模型直接输出关键点 + 颜色 + 类别

[Detector.yolo]
    #@string 推理后端: "openvino" | "tensorrt" | "onnxruntime"
    backend = "tensorrt"

    #@string 模型文件 (相对于 asset 目录)
    # armor_0526.onnx: 原始模型 (FP16 输入)
    # armor_0526_fp32.onnx: 转换后 (FP32 输入)
    # TensorRT 会自动检测输入类型并使用对应预处理
    model = "armor_0526.onnx"

    #@int 输入尺寸 (正方形)
    input_size = 640

    #@double 置信度阈值
    conf_threshold = 0.4

    #@double NMS 阈值
    nms_threshold = 0.45

# OpenVINO 后端配置
[Detector.yolo.openvino]
    #@string 推理设备: "CPU" | "GPU" | "AUTO"
    device = "GPU"

# TensorRT 后端配置
[Detector.yolo.tensorrt]
    #@bool 使用 FP16 推理
    fp16 = true

    #@bool 使用 INT8 量化 (需要校准数据)
    # INT8 用法:
    #   1. 在 asset/int8_calib_data/ 放入 100-500 张代表性图片
    #   2. 设置 int8 = true, fp16 = false
    #   3. 首次运行会自动校准并生成 asset/int8_calib.cache
    #   4. 后续运行直接加载缓存
    # 抽帧命令: ffmpeg -i video.avi -vf "select=not(mod(n\,10))" -frames:v 200 int8_calib_data/frame_%04d.jpg
    int8 = false

    #@int 工作空间大小 (MB)
    workspace_mb = 1024
