# =============================================================================
# 能量机关检测器配置
# =============================================================================
# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10

[Detector]
    #@string 检测器类型: "traditional" 或 "yolo"
    type = "traditional"
    #@bool 是否开启调试模式 (显示 OpenCV 窗口)
    debug = false

# ==================== 传统检测器配置 ====================

[TraditionalDetector]
    #@int 红色通道差阈值 (R - B)
    gray_threshold_red = 80
    #@int 蓝色通道差阈值 (B - R)
    gray_threshold_blue = 80

    # R标检测参数
    #@double R标最小面积
    r_area_min = 100.0
    #@double R标最大面积
    r_area_max = 5000.0
    #@double R标最小圆度
    r_circularity_min = 0.2
    #@double R标最大圆度
    r_circularity_max = 0.9

    # 靶心检测参数
    #@double 靶心最小面积
    target_area_min = 60.0
    #@double 靶心最大面积
    target_area_max = 6000.0
    #@double 靶心最小长宽比
    target_aspect_min = 0.99
    #@double 靶心最大长宽比
    target_aspect_max = 1.55

    # 缺口检测参数
    #@double 缺口面积/靶心面积 最小比
    gap_area_ratio_min = 0.025
    #@double 缺口面积/靶心面积 最大比
    gap_area_ratio_max = 0.20
    #@double 缺口长宽比最小
    gap_aspect_min = 1.55
    #@double 缺口长宽比最大
    gap_aspect_max = 8.0

    # 箭头检测参数
    #@double 箭头最小面积
    arrow_area_min = 100.0
    #@double 箭头最大面积
    arrow_area_max = 4000.0
    #@double 箭头最小长宽比
    arrow_aspect_min = 2.0
    #@double 箭头最大长宽比
    arrow_aspect_max = 6.0

    # 准确度阈值
    #@double 准确度阈值 (低于此值的检测结果会被丢弃)
    accuracy_threshold = 0.8

    # 调试选项
    #@bool 是否显示 OpenCV 窗口
    show_window = false
    #@bool 是否保存调试图像
    save_debug_image = false

# ==================== YOLO 检测器配置 (预留) ====================

[YoloDetector]
    #@string 模型文件路径 (相对于 asset 目录)
    model_path = "buff.onnx"
    #@double 置信度阈值
    confidence_threshold = 0.5
    #@double NMS 阈值
    nms_threshold = 0.45
    #@int 输入尺寸
    input_size = 640
