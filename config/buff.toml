# =============================================================================
# 能量机关运行时参数 (热重载)
# =============================================================================
# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10

# ==================== 模式判断 ====================

[AutoBuff.Mode]
    #@int 连续检测到 lit>=2 达到此帧数后进入 LARGE_ACTIVE
    enter_large_active_frames = 3
    #@int 连续检测到 lit<2 达到此帧数后退回 LARGE_INACTIVE
    exit_large_active_frames = 4

# ==================== 预测器 ====================

[AutoBuff.Predictor.Debounce]
    #@int 亮起确认帧数 (检测到lit连续此帧数后确认ON)
    on_frames = 3
    #@int 熄灭确认帧数 (未检测到连续此帧数后确认OFF)
    off_frames = 4
    #@double 丢失超时 (s)，超时直接OFF
    missing_timeout = 0.12

[AutoBuff.Predictor.SmallEKF]
    #@double phi 过程噪声
    q_phi = 0.0002
    #@double omega 过程噪声
    q_omega = 0.005
    #@double phi 观测噪声
    r_phi = 0.004

[AutoBuff.Predictor.LargeLSM]
    #@double 滑窗时间 (s)
    window_sec = 2.2
    #@int 最少样本数
    min_samples = 35
    #@double 最短时间跨度 (s)
    min_span_sec = 0.6
    #@double Huber 核参数
    huber_delta = 0.1
    #@double RMS 残差接受阈值
    residual_accept = 0.18

# ==================== 传统检测器 ====================

# 传统检测器参数
# 调试时用 cv::imshow 观察二值图和轮廓，按需微调
[AutoBuff.Detector.Traditional]
    #@int 颜色差分二值化阈值 (0-255)，越低白点越多
    bin_threshold = 50
    #@int 颜色校验差分阈值 (0-255)，越低越容易通过颜色筛选
    color_diff_threshold = 30
    #@double R 标最小轮廓面积 (px²)
    rune_center_min_area = 30.0
    #@double R 标最大轮廓面积 (px²)
    rune_center_max_area = 5000.0
    #@double R 标宽高比容差 (1.0 = 正圆)，越大越允许椭圆
    rune_center_aspect_ratio_tol = 0.8
    #@double R 标最小填充比 (0~1)，0.3 允许较空心轮廓
    rune_center_fill_ratio_min = 0.2
    #@double 扇叶单轮廓最小面积 (px²)
    rune_target_min_area = 30.0
    #@double 扇叶单轮廓最大面积 (px²)
    rune_target_max_area = 8000.0
    #@double 扇叶聚类最大宽高比，越大越允许长条形
    rune_target_max_square_ratio = 1.3
    #@double 扇叶空间聚类半径 (px)，越大越容易聚到一起
    rune_target_cluster_radius = 70.0

# ==================== 火控 ====================

[AutoBuff.FireControl]
    #@double 射击误差阈值 (rad)
    fire_threshold = 0.02
    #@double 最小置信度
    min_confidence = 0.30
    #@double 置信度对评分的权重 (0=纯跟踪误差)
    w_confidence = 0.05
    #@string 协同角色: "disabled" / "ccw_first" / "ccw_second"
    coop_role = "disabled"
    #@bool 仅在大符激活时启用协同
    coop_only_large_active = true

[AutoBuff.FireControl.Latency]
    #@double 发送→控制器响应延迟 (s)
    send_to_control = 0.003
    #@double 控制→出膛延迟 (s)
    control_to_fire = 0.020
