# 本文件严格区分参数的数据类型，比如 10.0 不能改成 10
[Camera]
    #@bool 是否通过sn码查找相机,false则查找第0个
    use_camera_sn = true
    #@string 相机sn码
    camera_sn = "00G07828078"
    #@bool 使用从MVS中导出的配置文件
    use_config_from_file = true
    #@string 配置文件在config文件夹中的路径
    config_file_path = "MV-CA016-10UC_00G07828078.mfs"
    #@bool 是否从camera.config中设置参数,会覆盖上文中file中的参数
    use_camera_config = true

#键可以填写MVS中的键,请严格遵守类型要求
#枚举类型请使用字符串,参考MV_CC_SetEnumValueByString,
#但无法检查是否设置成功,只能看有无对应的HIKCAM_WARN
[Camera.config]
    #@float
    ExposureTime = 4000.0
    #@float
    Gain = 16.0
    ReverseX = false
    ReverseY = false
    Width = 1440
    ADCBitDepth = "Bits_8"
    AcquisitionFrameRate = 200.0
    AcquisitionFrameRateEnable = true

[Camera.record]
    #@bool 是否开启内录,比赛必开启内录,不受此值影响
    recording = false
    fps = 15

[Serial]
    port_name = "/dev/ttyUSB0"
    baudrate = 921600
    data_print_debug = false
    ignore_crc = false
    # 不接串口时使用虚拟数据
    use_fake_serial_data = true

# fake serial 虚拟数据配置
[Serial.fake_data]
    # IMU姿态
    yaw_deg = 0.0
    pitch_deg = 0.0
    roll_deg = 0.0
    # 机器人状态
    robot_id = 3           # 1-7红方, 101-107蓝方
    enemy_color = 1        # 0=未知, 1=红, 2=蓝
    # 射击参数
    bullet_speed = 15.0    # m/s
    # 模式控制
    aim_mode = 1           # 0=关闭, 1=自瞄, 2=小符, 3=大符
    allow_fire = true

[TimeSync]
    # 相机-IMU时间偏移 (微秒)
    # 正值: 图像比IMU数据晚到达，匹配过去的IMU
    # 负值: 图像比IMU数据早到达，匹配未来的IMU
    # 例: delta_t_us = 5000 表示图像实际对应5ms前的IMU姿态
    delta_t_us = 0

