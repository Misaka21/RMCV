# ============================================================================
# Recorder 录制模块配置
# 该文件支持热更新
# ============================================================================

[Recorder]
# 主开关 (运行时可修改)
enable_recording = true

# 录制内容选择
record_raw_video = true       # 录制原始视频
record_debug_video = false     # 录制调试视频
record_imu_csv = true         # 录制IMU数据

# 视频参数
video_codec = "MJPG"          # 编码格式
camera_fps = 200.0            # 相机帧率
sample_interval = 4           # 采样间隔，录制帧率 = camera_fps / sample_interval
